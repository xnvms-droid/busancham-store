<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e293b">
<title>후원주점 서빙 시스템</title>
<script src="config.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --sub:#64748b; --muted:#94a3b8;
  --pri:#2563eb; --pri-d:#1d4ed8; --ok:#16a34a; --ok-bg:#dcfce7; --warn:#ea580c; --warn-bg:#ffedd5;
  --red:#dc2626; --red-bg:#fee2e2; --pur:#7c3aed; --pur-bg:#ede9fe; --dark:#1e293b;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0}
.muted{color:var(--muted)} .red{color:var(--red)} .green{color:var(--ok)} .purple{color:var(--pur)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;margin:0}

/* 상단바 */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--dark);color:#fff;min-height:52px}
.brand{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.demo-badge{background:#f59e0b;color:#111;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
.tnav{display:flex;gap:4px;margin-left:8px}
.tnav a{padding:7px 14px;border-radius:8px;color:#cbd5e1;font-weight:600;white-space:nowrap}
.tnav a.on{background:#fff;color:var(--dark)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:#cbd5e1;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:5px;vertical-align:1px}
.sync.ok::before{background:#22c55e} .sync.err{color:#fca5a5} .sync.err::before{background:#ef4444}
.staff-btn,.icon-btn{background:#334155;color:#e2e8f0;padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap}

#busy{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;z-index:90;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#busy.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:700;background:#e2e8f0;white-space:nowrap}
.btn.primary{background:var(--pri);color:#fff} .btn.primary:active{background:var(--pri-d)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.danger-ghost{background:#fff;border:1px solid #fecaca;color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 18px;font-size:16px}
.chip{padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.stp{width:40px;height:40px;border-radius:10px;background:#e2e8f0;font-size:22px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.stp.plus{background:var(--pri);color:#fff}
.toggle{padding:9px 14px;border-radius:10px;border:2px solid var(--warn);color:var(--warn);background:#fff;font-weight:700}
.toggle.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}

/* 홈 */
.home{max-width:640px;margin:0 auto;padding:28px 16px 60px}
.home h1{font-size:26px;margin-bottom:4px}
.home .sub{color:var(--sub);margin:0 0 22px}
.mode{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.mode b{display:block;font-size:20px;margin-bottom:4px}
.mode span{color:var(--sub)}
.mode:active{background:#f8fafc}
.home-foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notebox{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;color:#92400e;font-size:14px;margin-top:16px}
.setup{max-width:560px;margin:30px auto;background:#fff;border-radius:16px;padding:22px;border:1px solid var(--line)}
.setup h2{margin-bottom:8px}
.setup p{color:var(--sub)}
.setup input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px}
.loading{padding:60px 20px;text-align:center;color:var(--sub)}

/* 포스 */
.pos{padding:12px 14px 20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:stretch}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;min-width:130px}
.stat span{display:block;font-size:12px;color:var(--sub);font-weight:600}
.stat b{font-size:22px}
.stat small{color:var(--sub);margin-left:2px}
.stat.warn b{color:var(--warn)} .stat.danger b{color:var(--red)}
.stat-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pos-body{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:128px;display:flex;flex-direction:column;gap:3px;transition:transform .05s}
.tcard:active{transform:scale(.98)}
.tc-top{display:flex;align-items:center;justify-content:space-between}
.tno{font-size:26px;font-weight:800;line-height:1}
.pbadge{background:var(--warn);color:#fff;font-weight:800;border-radius:99px;min-width:26px;height:26px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.tc-meta{font-size:13px;color:var(--sub)}
.nospoon{color:var(--warn);font-weight:700}
.tc-amt{font-size:18px;font-weight:800;margin-top:auto}
.tc-bal{font-size:13px;font-weight:700}
.tc-foot{font-size:12px;color:var(--muted)}
.tc-empty{color:var(--muted);margin-top:auto;font-weight:600}
.tcard.empty{background:#f8fafc;border-style:dashed}
.tcard.empty .tno{color:var(--muted)}
.tcard.has-pending{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.tcard.paid{background:#f0fdf4}
.tcard.due .tc-amt{color:var(--ink)}
.pos-side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.side-head h3{font-size:17px}
.cnt{background:var(--warn);color:#fff;border-radius:99px;padding:1px 9px;font-size:14px;margin-left:4px}
.agg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.agg-chip{background:var(--warn-bg);color:#9a3412;padding:4px 10px;border-radius:99px;font-size:13px}
.plist{overflow:auto;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.prow.late{border-color:#fca5a5;background:#fef2f2}
.ptno{flex:none;width:40px;height:40px;border-radius:10px;background:var(--dark);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.pinfo small{color:var(--sub);font-size:12px}
.note{color:#b45309 !important;font-weight:600}

/* 모달 */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:16px;width:min(480px,100%);max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.xl{width:min(1180px,100%);height:calc(100vh - 24px)}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.m-head h3{font-size:19px}
.m-head .muted{font-size:13px}
.x{margin-left:auto;font-size:26px;line-height:1;width:40px;height:40px;border-radius:10px;background:#f1f5f9}
.m-body{padding:16px}
.m-body p{margin:0 0 10px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.m-foot .btn{min-width:96px}
.warnbox{background:var(--red-bg);color:#991b1b;border-radius:10px;padding:10px 12px;font-weight:600}
.confirm-list{list-style:none;padding:0;margin:0 0 10px}
.confirm-list li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:16px}
.confirm-total{text-align:right;font-size:17px}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:18px}
.fld textarea{font-size:15px;min-height:90px;resize:vertical}
.seg{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:8px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pay-due{background:#f8fafc;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column}
.pay-due span{font-size:13px;color:var(--sub)} .pay-due b{font-size:28px} .pay-due small{color:var(--sub)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.change{margin-top:12px;font-size:17px;background:var(--ok-bg);border-radius:10px;padding:10px 14px}
.change b{font-size:22px;margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin-top:12px !important}
.move-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.move-grid .btn{font-size:18px;padding:14px 0}
.madmin-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.madmin-row .nm{flex:1}
.madmin-row .nm small{color:var(--sub);margin-left:6px}
.madmin-row.soldout .nm{color:var(--muted);text-decoration:line-through}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}

/* 테이블 상세 */
.td{display:flex;flex-direction:column;min-height:0;flex:1}
.td-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.ctl-group{display:flex;align-items:center;gap:8px}
.ctl-group .lbl{font-weight:700;color:var(--sub)}
.pval{min-width:30px;text-align:center;font-size:22px}
.memo-btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.td-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px;background:#f8fafc;border-bottom:1px solid var(--line)}
.td-sum div{display:flex;flex-direction:column}
.td-sum span{font-size:12px;color:var(--sub);font-weight:600}
.td-sum b{font-size:19px}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:3}
.tabs button{flex:1;padding:13px 6px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs small{color:var(--muted)} .tabs em{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.td-panes .pane{display:none}
.td-panes.show-order .pane-order,.td-panes.show-list .pane-list{display:block}
.pane{padding:12px 16px 16px}
.mp-cat{margin-bottom:14px}
.mp-cat h4{font-size:13px;color:var(--sub);margin-bottom:6px}
.mp-list{display:grid;grid-template-columns:1fr;gap:6px}
.mp-item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px}
.mp-item.sel{border-color:var(--pri);background:#eff6ff}
.mp-item.off{opacity:.5}
.mp-name{flex:1;text-align:left;display:flex;flex-direction:column;padding:6px 8px;min-height:44px;justify-content:center}
.mp-name span{font-weight:700;font-size:16px}
.mp-name small{color:var(--sub)}
.mp-stp{display:flex;align-items:center;gap:6px}
.mp-stp b{min-width:22px;text-align:center;font-size:18px}
.cart-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px;z-index:2}
.note-in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.cart-row{display:flex;gap:8px;align-items:center}
.cart-sum{flex:1;font-size:15px}
.cart-sum b{font-size:18px}
.ol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.ol h4,.paybox h4{font-size:15px}
.ol-row{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff}
.ol-row.s-대기{border-left:5px solid var(--warn)}
.ol-row.s-서빙완료{border-left:5px solid var(--ok)}
.ol-row.s-취소{opacity:.55}
.ol-row.s-취소 .ol-name,.ol-row.s-취소 .ol-amt{text-decoration:line-through}
.ol-main{display:flex;align-items:baseline;gap:8px}
.ol-time{color:var(--muted);font-size:12px}
.ol-name{font-size:16px}
.ol-amt{margin-left:auto;font-weight:700}
.ol-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.ol-sub small{color:var(--sub)}
.ol-btns{margin-left:auto;display:flex;gap:6px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.st-대기{background:var(--warn-bg);color:#9a3412} .st-서빙완료{background:var(--ok-bg);color:#166534} .st-취소{background:#f1f5f9;color:var(--sub)}
.paybox{margin-top:16px;padding-top:14px;border-top:2px solid var(--line)}
.pay-hist{margin:8px 0;font-size:14px}
.pay-hist div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.pay-btns{display:flex;gap:8px;margin:10px 0}
.pay-btns .primary{flex:1}
.tbl-actions{display:flex;gap:8px;justify-content:space-between;margin-top:14px}

/* 서빙(모바일) */
.serve{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.tgrid.compact{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.tgrid.compact .tcard{min-height:100px;padding:8px}
.tgrid.compact .tcard.empty{min-height:72px}
.tgrid.compact .tno{font-size:22px}
.tgrid.compact .tc-amt{font-size:15px}
.tgrid.compact .tc-meta,.tgrid.compact .tc-bal{font-size:12px;white-space:nowrap}
.tgrid.compact .pbadge{min-width:22px;height:22px;font-size:13px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:15}
.bottom-nav a{flex:1;text-align:center;padding:16px 0;font-weight:700;color:var(--sub)}
.bottom-nav a.on{color:var(--pri)}
.bottom-nav b{background:var(--warn);color:#fff;border-radius:99px;padding:0 8px;font-size:13px}
.plist-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.serve-table{background:#fff;min-height:calc(100vh - 52px);display:flex;flex-direction:column}
.st-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st-head h2{font-size:21px}
.back{padding:8px 12px;background:#f1f5f9;border-radius:10px;font-weight:700}
.serve-table .pane-order{padding-bottom:4px}
.serve-table .tabs{top:52px}
.modal .tabs{position:static}

/* 정산 */
.settle{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.settle-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.settle-head h2{font-size:22px}
.settle-head .noprint{display:flex;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card span{display:block;font-size:13px;color:var(--sub);font-weight:600}
.card b{display:block;font-size:24px;margin:2px 0}
.card small{color:var(--sub)}
.card.danger b{color:var(--red)}
.settle h3{margin:22px 0 8px;font-size:17px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:#f8fafc;color:var(--sub);font-size:13px}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:800;background:#f8fafc}
.tbl-wrap{overflow-x:auto}
.bar{height:8px;background:#dbeafe;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--pri)}

@media (min-width:900px){
  .td-panes{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
  .modal.xl{overflow:hidden}
  .td-panes .pane{display:block !important;overflow:auto}
  .td-panes .pane-order{border-right:1px solid var(--line)}
  .tabs{display:none}
  .modal.xl .td{overflow:hidden}
  .modal.xl .td-panes .pane{max-height:100%}
  .mp-list{grid-template-columns:1fr 1fr}
}
@media (max-width:1000px){
  .pos-body{grid-template-columns:1fr}
  .pos-side{position:static;max-height:none}
}
@media (max-width:640px){
  #topbar{gap:8px;padding:8px 10px}
  .brand{font-size:15px;max-width:28vw}
  .demo-badge{display:none}
  .tnav{margin-left:0;gap:2px}
  .tnav a{padding:6px 8px;font-size:14px}
  .sync{display:none}
  .tright{gap:5px}
  .staff-btn{max-width:64px;overflow:hidden;text-overflow:ellipsis;padding:6px 8px}
  .icon-btn{padding:6px 8px}
  .modal{border-radius:16px 16px 0 0;max-height:calc(100vh - 40px);margin-top:auto}
  .backdrop{align-items:flex-end;padding:0}
  .modal.xl{height:calc(100vh - 20px)}
  .stat{min-width:calc(50% - 5px);padding:8px 12px}
  .stat b{font-size:19px}
  .td-sum b{font-size:17px}
}
@media print{
  #topbar,.noprint,#toast,#busy,.bottom-nav{display:none !important}
  body{background:#fff}
  .card,.tbl{border-color:#999}
  .settle{padding:0}
}
</style>
</head>
<body>
<header id="topbar"></header>
<main id="app"></main>
<div id="modal-root"></div>
<div id="busy">전송 중…</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ───────── 기본 설정 ───────── */
  var CFG = Object.assign({ API_URL: '', POLL_MS: 4000 }, window.APP_CONFIG || {});
  var DEMO = new URLSearchParams(location.search).has('demo');
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('hj_' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('hj_' + k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('hj_' + k); } catch (e) {} }
  };
  var API_URL = (CFG.API_URL || LS.get('api', '')).trim();

  var S = {
    state: null, rev: -1, offset: 0, lastSync: 0, failCount: 0,
    pin: LS.get('pin', ''), staff: LS.get('staff', ''), needPin: false,
    carts: {}, cartReq: {}, notes: {}, peopleDraft: {}, peopleTimer: {},
    filter: 'all', tab: {}, modals: [], summary: null,
    inflight: 0, writeSeq: 0, queue: Promise.resolve(), timer: null, deferred: false
  };

  /* ───────── 유틸 ───────── */
  function $(s, r) { return (r || document).querySelector(s); }
  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function now() { return Date.now() + S.offset; }
  function hhmm(ms) { if (!ms) return '-'; var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDT(ms) { if (!ms) return '-'; var d = new Date(ms); return (d.getMonth() + 1) + '. ' + d.getDate() + '. ' + hhmm(ms); }
  function mins(ms) { return ms ? Math.max(0, Math.floor((now() - ms) / 60000)) : 0; }
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function route() {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    return { view: parts[0] || 'home', arg: parts[1] };
  }
  function getT(no) {
    if (!S.state) return null;
    for (var i = 0; i < S.state.tables.length; i++) if (S.state.tables[i].no === no) return S.state.tables[i];
    return null;
  }
  function peopleOf(t) { return S.peopleDraft[t.no] != null ? S.peopleDraft[t.no] : (t.people || 0); }
  function menuByName(n) {
    var m = S.state.menu;
    for (var i = 0; i < m.length; i++) if (m[i].name === n) return m[i];
    return null;
  }
  function pendingList() {
    var out = [];
    S.state.tables.forEach(function (t) {
      t.orders.forEach(function (o) { if (o.status === '대기') out.push(Object.assign({ table: t.no }, o)); });
    });
    return out.sort(function (a, b) { return a.time - b.time; });
  }
  function ready() { return (DEMO || API_URL) && !S.needPin; }

  function toast(msg, type) {
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    $('#toast').appendChild(el);
    setTimeout(function () { el.remove(); }, type === 'err' ? 4500 : 2400);
  }
  function showBusy() { $('#busy').classList.toggle('on', S.inflight > 0); }

  /* ───────── 서버 통신 ───────── */
  var demoReady = !DEMO ? Promise.resolve() : new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'demo/gas-mock.js';
    s.onload = function () {
      fetch('apps-script/Code.gs').then(function (r) { return r.text(); }).then(function (code) {
        var c = document.createElement('script');
        c.textContent = code;
        document.head.appendChild(c);
        resolve();
      }).catch(reject);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });

  function api(params, post) {
    params = Object.assign({ pin: S.pin }, params);
    if (DEMO) return demoReady.then(function () { return window.DemoBackend.call(params, post); });
    var req = post
      ? fetch(API_URL, { method: 'POST', body: JSON.stringify(params), redirect: 'follow' })
      : fetch(API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString(), { redirect: 'follow', cache: 'no-store' });
    return req.then(function (res) {
      if (!res.ok) throw new Error('서버 응답 오류(' + res.status + ')');
      return res.text();
    }).then(function (txt) {
      try { return JSON.parse(txt); }
      catch (e) { throw new Error('서버 응답을 해석할 수 없습니다. 웹 앱 배포 설정(액세스 권한: 모든 사용자)을 확인해 주십시오.'); }
    });
  }

  function applyState(st, fromWrite) {
    if (!st) return;
    if (!fromWrite && st.rev < S.rev) return;
    S.offset = (st.serverTime || Date.now()) - Date.now();
    var changed = st.rev !== S.rev || fromWrite || !S.state;
    S.state = st;
    S.rev = st.rev;
    if (changed) render();
  }

  function poll() {
    clearTimeout(S.timer);
    if (!ready() || document.hidden || S.inflight) { schedule(); return; }
    var seq = S.writeSeq;
    api({ action: 'state', _t: Date.now() }).then(function (r) {
      if (seq !== S.writeSeq) return;
      if (!r.ok) {
        if (r.code === 'PIN') askPin(r.error);
        else { S.failCount++; toastOnce(r.error); }
        return;
      }
      S.failCount = 0;
      S.lastSync = Date.now();
      applyState(r.state);
    }).catch(function () {
      S.failCount++;
    }).then(function () { updateSync(); schedule(); });
  }
  var lastErrToast = '';
  function toastOnce(msg) { if (msg !== lastErrToast) { lastErrToast = msg; toast(msg, 'err'); } }
  function schedule() {
    clearTimeout(S.timer);
    var ms = Number(CFG.POLL_MS) || 4000;
    if (route().view === 'pos') ms = Math.min(ms, 3000);
    if (S.failCount >= 2) ms = Math.max(ms, 6000);
    S.timer = setTimeout(poll, ms);
  }

  /** 쓰기 요청 — 순서대로 처리(대기열) */
  function send(action, data, okMsg) {
    S.inflight++; S.writeSeq++; showBusy();
    var p = S.queue.then(function () {
      return api(Object.assign({ action: action, by: S.staff }, data), true).then(function (r) {
        if (!r.ok) {
          S.rev = -1;
          if (r.code === 'PIN') askPin(r.error); else toast(r.error, 'err');
          return null;
        }
        S.failCount = 0;
        S.lastSync = Date.now();
        applyState(r.state, true);
        if (okMsg) toast(okMsg);
        return r;
      }).catch(function () {
        S.rev = -1;
        toast('전송에 실패했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주십시오.', 'err');
        return null;
      });
    });
    S.queue = p.then(function () {}, function () {});
    return p.then(function (r) {
      S.inflight--; showBusy();
      if (!r) setTimeout(poll, 300);
      return r;
    });
  }

  function loadSummary() {
    if (!ready()) return;
    api({ action: 'summary', _t: Date.now() }).then(function (r) {
      if (!r.ok) { if (r.code === 'PIN') askPin(r.error); else toast(r.error, 'err'); return; }
      S.summary = r.summary;
      if (route().view === 'settle') render();
    }).catch(function () { toast('정산 자료를 불러오지 못했습니다.', 'err'); });
  }

  /* ───────── 렌더링 ───────── */
  function isTyping() {
    var a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? a : null;
  }
  function saveScroll(root) {
    var map = { _win: window.scrollY };
    (root || document).querySelectorAll('[data-scroll], .modal, .pane').forEach(function (el, i) {
      map[(el.getAttribute('data-scroll') || el.className) + '#' + i] = el.scrollTop;
    });
    return map;
  }
  function restoreScroll(map, root) {
    (root || document).querySelectorAll('[data-scroll], .modal, .pane').forEach(function (el, i) {
      var k = (el.getAttribute('data-scroll') || el.className) + '#' + i;
      if (map[k] != null) el.scrollTop = map[k];
    });
    if (!root) window.scrollTo(0, map._win);
  }

  function render() {
    var typing = isTyping();
    if (typing && typing.closest('#app')) { S.deferred = true; return; }
    renderTopbar();
    var app = $('#app');
    var sc = saveScroll(app);
    var r = route();
    var html;
    if (!DEMO && !API_URL) html = viewSetup();
    else if (r.view === 'home') html = viewHome();
    else if (!S.state) html = '<div class="loading">' + (S.needPin ? '접속 비밀번호를 입력해 주십시오.' : '불러오는 중…') + '</div>';
    else if (r.view === 'pos') html = viewPos();
    else if (r.view === 'serve') html = viewServe(r.arg);
    else if (r.view === 'settle') html = viewSettle();
    else html = viewHome();
    app.innerHTML = html;
    restoreScroll(sc, app);
    window.scrollTo(0, sc._win);
    var m = topModal();
    if (m && m.live) {
      if (typing && typing.closest('#modal-root')) S.deferred = true;
      else renderModal();
    }
  }
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (S.deferred && !isTyping()) { S.deferred = false; render(); }
    }, 60);
  });

  function renderTopbar() {
    var r = route();
    var name = S.state ? S.state.eventName : '후원주점';
    document.title = name + ' · 서빙 시스템';
    $('#topbar').innerHTML =
      '<a class="brand" href="#">' + h(name) + '</a>' + (DEMO ? '<span class="demo-badge">체험판</span>' : '') +
      '<nav class="tnav">' + [['pos', '포스'], ['serve', '서빙'], ['settle', '정산']].map(function (x) {
        return '<a href="#' + x[0] + '" class="' + (r.view === x[0] ? 'on' : '') + '">' + x[1] + '</a>';
      }).join('') + '</nav>' +
      '<div class="tright"><span id="sync" class="sync"></span>' +
      '<button class="staff-btn" data-act="staff">' + h(S.staff || '이름 설정') + '</button>' +
      '<button class="icon-btn" data-act="settings">설정</button></div>';
    updateSync();
  }
  function updateSync() {
    var el = $('#sync');
    if (!el) return;
    if (S.failCount >= 2) { el.className = 'sync err'; el.textContent = '연결 끊김'; return; }
    if (!S.lastSync) { el.className = 'sync'; el.textContent = '연결 중'; return; }
    var s = Math.floor((Date.now() - S.lastSync) / 1000);
    el.className = 'sync ok';
    el.textContent = s < 2 ? '동기화됨' : s + '초 전 동기화';
  }

  /* 홈 */
  function viewHome() {
    var name = S.state ? S.state.eventName : '후원주점';
    return '<div class="home"><h1>' + h(name) + '</h1><p class="sub">사용할 화면을 선택하십시오.</p>' +
      '<a class="mode" href="#pos"><b>포스 현황판</b><span>노트북용 · 전체 테이블 현황, 미서빙 주문, 결제·정리</span></a>' +
      '<a class="mode" href="#serve"><b>서빙 주문</b><span>휴대전화용 · 테이블 선택 후 인원·수저·주문 입력, 현금 결제</span></a>' +
      '<a class="mode" href="#settle"><b>정산</b><span>메뉴별 판매, 수납액, 미수금, 테이블별 내역</span></a>' +
      (DEMO ? '<div class="notebox">체험판입니다. 데이터는 이 브라우저에만 저장되며 실제 구글 시트와 연결되지 않습니다. 같은 브라우저의 다른 탭에서 포스·서빙 화면을 동시에 열어 연동을 확인하실 수 있습니다.</div>' : '') +
      '<div class="home-foot">' +
      (DEMO ? '<button class="btn ghost" data-act="demoReset">체험 데이터 초기화</button><button class="btn ghost" data-act="exitDemo">체험판 종료</button>' : '') +
      '<button class="btn ghost" data-act="settings">설정</button></div></div>';
  }

  function viewSetup() {
    return '<div class="setup"><h2>서버 주소 설정</h2>' +
      '<p>구글 시트에 연결된 Apps Script 웹 앱 주소를 입력하십시오.<br>config.js 파일에 주소를 입력해 두면 이 화면 없이 바로 접속됩니다.</p>' +
      '<input id="apiIn" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">' +
      '<button class="btn primary" data-act="setupSave">저장 후 접속</button>' +
      '<hr style="margin:22px 0;border:0;border-top:1px solid var(--line)">' +
      '<p>서버 설정 전에 화면 구성을 먼저 확인하시려면 체험판을 이용하십시오.</p>' +
      '<button class="btn ghost" data-act="goDemo">체험판으로 보기</button></div>';
  }

  /* 포스 */
  function stat(label, val, unit, cls) {
    return '<div class="stat ' + (cls || '') + '"><span>' + label + '</span><b>' + val + '</b><small>' + unit + '</small></div>';
  }
  function viewPos() {
    var ts = S.state.tables;
    var act = ts.filter(function (t) { return t.active; });
    var pend = pendingList();
    var people = act.reduce(function (a, t) { return a + peopleOf(t); }, 0);
    var total = act.reduce(function (a, t) { return a + t.total; }, 0);
    var due = act.reduce(function (a, t) { return a + Math.max(0, t.balance); }, 0);
    var f = S.filter;
    var shown = ts.filter(function (t) {
      return f === 'all' || (f === 'active' && t.active) || (f === 'empty' && !t.active) ||
        (f === 'pending' && t.pending > 0) || (f === 'due' && t.balance > 0);
    });
    var filters = [['all', '전체'], ['active', '이용 중'], ['pending', '미서빙'], ['due', '미결제'], ['empty', '빈자리']];
    return '<div class="pos"><div class="stats">' +
      stat('이용 중 테이블', act.length + ' / ' + ts.length, '') +
      stat('현재 인원', people, '명') +
      stat('미서빙 주문', pend.length, '건', pend.length ? 'warn' : '') +
      stat('이용 중 주문액', won(total), '원') +
      stat('받을 금액', won(due), '원', due ? 'danger' : '') +
      '<div class="stat-actions"><button class="btn ghost" data-act="menuAdmin">메뉴 품절관리</button></div></div>' +
      '<div class="pos-body"><section><div class="filters">' +
      filters.map(function (x) { return '<button class="chip ' + (f === x[0] ? 'on' : '') + '" data-act="filter" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
      '</div><div class="tgrid">' + (shown.map(function (t) { return tableCard(t, false); }).join('') || '<p class="empty">해당하는 테이블이 없습니다.</p>') +
      '</div></section><aside class="pos-side">' + pendingPanel(pend) + '</aside></div></div>';
  }

  function balLabel(t) {
    if (!t.total && !t.paid) return '<span class="muted">주문 없음</span>';
    if (t.balance > 0) return '<span class="red">미결제 ' + won(t.balance) + '</span>';
    if (t.balance < 0) return '<span class="purple">초과 ' + won(-t.balance) + '</span>';
    return '<span class="green">결제완료</span>';
  }
  function tableCard(t, compact) {
    var cls = ['tcard'];
    if (!t.active) cls.push('empty');
    else {
      if (t.pending) cls.push('has-pending');
      if (t.balance > 0) cls.push('due');
      else if (t.total > 0 && t.balance === 0) cls.push('paid');
    }
    var body;
    if (!t.active) body = '<div class="tc-empty">빈자리</div>';
    else if (compact) {
      var cb = (!t.total && !t.paid) ? '<span class="muted">주문 없음</span>' : t.balance > 0 ? '<span class="red">미결제</span>' : t.balance < 0 ? '<span class="purple">초과결제</span>' : '<span class="green">결제완료</span>';
      body = '<div class="tc-meta">' + peopleOf(t) + '명 · ' + (t.spoon ? '수저✓' : '<span class="nospoon">수저✗</span>') + '</div>' +
        '<div class="tc-amt">' + won(t.total) + '</div><div class="tc-bal">' + cb + '</div>';
    } else {
      body = '<div class="tc-meta">' + peopleOf(t) + '명 · ' + (t.spoon ? '수저 ✓' : '<span class="nospoon">수저 미세팅</span>') + '</div>' +
        '<div class="tc-amt">' + won(t.total) + '원</div><div class="tc-bal">' + balLabel(t) + '</div>' +
        '<div class="tc-foot">착석 ' + hhmm(t.seatedAt) + ' · ' + mins(t.seatedAt) + '분 경과</div>';
    }
    return '<button class="' + cls.join(' ') + '" data-act="' + (compact ? 'goTable' : 'openTable') + '" data-no="' + t.no + '">' +
      '<div class="tc-top"><span class="tno">' + t.no + '</span>' + (t.pending ? '<span class="pbadge">' + t.pending + '</span>' : '') + '</div>' +
      body + '</button>';
  }

  function pendingPanel(pend) {
    var agg = {}, order = [];
    pend.forEach(function (o) { if (agg[o.name] == null) { agg[o.name] = 0; order.push(o.name); } agg[o.name] += o.qty; });
    return '<div class="side-head"><h3>미서빙 주문 <span class="cnt">' + pend.length + '</span></h3></div>' +
      (pend.length ? '<div class="agg">' + order.map(function (n) { return '<span class="agg-chip">' + h(n) + ' <b>' + agg[n] + '</b></span>'; }).join('') + '</div>' : '') +
      '<div class="plist" data-scroll="plist">' +
      (pend.length ? pend.map(function (o) {
        var m = mins(o.time);
        return '<div class="prow ' + (m >= 15 ? 'late' : '') + '"><span class="ptno">' + o.table + '</span>' +
          '<div class="pinfo"><b>' + h(o.name) + ' ×' + o.qty + '</b><small>' + hhmm(o.time) + ' · ' + m + '분 전' + (o.by ? ' · ' + h(o.by) : '') + '</small>' +
          (o.note ? '<small class="note">' + h(o.note) + '</small>' : '') + '</div>' +
          '<button class="btn sm ok" data-act="serveOne" data-id="' + h(o.id) + '">서빙완료</button></div>';
      }).join('') : '<p class="empty">미서빙 주문이 없습니다.</p>') + '</div>';
  }

  /* 서빙(모바일) */
  function viewServe(arg) {
    if (arg && arg !== 'pending') {
      var no = Number(arg), t = getT(no);
      if (!t) return '<p class="empty">존재하지 않는 테이블입니다. <a href="#serve">목록으로</a></p>';
      return '<div class="serve-table"><div class="st-head"><a class="back" href="#serve">← 목록</a><h2>' + no + '번 테이블</h2>' +
        '<span class="muted">' + (t.active ? '착석 ' + hhmm(t.seatedAt) + ' · ' + mins(t.seatedAt) + '분 경과' : '빈자리') + '</span></div>' +
        tableDetail(no, 'serve') + '</div>';
    }
    var pend = pendingList();
    var body = arg === 'pending'
      ? '<div class="plist-wrap">' + pendingPanel(pend) + '</div>'
      : '<div class="tgrid compact">' + S.state.tables.map(function (t) { return tableCard(t, true); }).join('') + '</div>';
    return '<div class="serve">' + body + '<nav class="bottom-nav"><a href="#serve" class="' + (arg ? '' : 'on') + '">테이블</a>' +
      '<a href="#serve/pending" class="' + (arg === 'pending' ? 'on' : '') + '">서빙 대기 <b>' + pend.length + '</b></a></nav></div>';
  }

  /* 테이블 상세(포스 모달·서빙 화면 공용) */
  function tableDetail(no, ctx) {
    var t = getT(no);
    var tab = S.tab[ctx] || (ctx === 'serve' ? 'order' : 'list');
    var validCnt = t.orders.filter(function (o) { return o.status !== '취소'; }).length;
    var balCls = t.balance > 0 ? 'red' : t.balance < 0 ? 'purple' : 'green';
    return '<div class="td"><div class="td-ctl">' +
      '<div class="ctl-group"><span class="lbl">인원</span><button class="stp" data-act="people" data-no="' + no + '" data-d="-1">−</button>' +
      '<b class="pval">' + peopleOf(t) + '</b><button class="stp" data-act="people" data-no="' + no + '" data-d="1">+</button></div>' +
      '<button class="toggle ' + (t.spoon ? 'on' : '') + '" data-act="spoon" data-no="' + no + '">' + (t.spoon ? '수저 세팅완료 ✓' : '수저 미세팅') + '</button>' +
      '<button class="btn ghost memo-btn" data-act="memo" data-no="' + no + '">' + (t.memo ? '메모: ' + h(t.memo) : '메모 추가') + '</button></div>' +
      '<div class="td-sum"><div><span>주문합계</span><b>' + won(t.total) + '</b></div><div><span>결제</span><b>' + won(t.paid) + '</b></div>' +
      '<div class="' + balCls + '"><span>' + (t.balance < 0 ? '초과결제' : '잔액') + '</span><b>' + won(Math.abs(t.balance)) + '</b></div></div>' +
      '<div class="tabs"><button class="' + (tab === 'order' ? 'on' : '') + '" data-act="tab" data-ctx="' + ctx + '" data-v="order">주문 입력</button>' +
      '<button class="' + (tab === 'list' ? 'on' : '') + '" data-act="tab" data-ctx="' + ctx + '" data-v="list">내역·결제 <small>' + validCnt + '</small>' + (t.pending ? ' <em>' + t.pending + '</em>' : '') + '</button></div>' +
      '<div class="td-panes show-' + tab + '"><section class="pane pane-order">' + menuPicker(no) + '</section>' +
      '<section class="pane pane-list">' + orderList(t) + payBox(t) + '</section></div></div>';

  function cartInfo(no) {
    var cart = S.carts[no] || {}, cnt = 0, sum = 0, items = [];
    Object.keys(cart).forEach(function (n) {
      var m = menuByName(n);
      if (!m || !cart[n]) return;
      cnt += cart[n]; sum += cart[n] * m.price;
      items.push({ name: n, qty: cart[n], price: m.price });
    });
    return { cnt: cnt, sum: sum, items: items };
  }

  function menuPicker(no) {
    var cart = S.carts[no] || {}, cats = [], by = {};
    S.state.menu.forEach(function (m) { if (!by[m.cat]) { by[m.cat] = []; cats.push(m.cat); } by[m.cat].push(m); });
    var ci = cartInfo(no);
    var list = cats.map(function (c) {
      return '<div class="mp-cat"><h4>' + h(c) + '</h4><div class="mp-list">' + by[c].map(function (m) {
        var q = cart[m.name] || 0, off = m.status !== '판매', nm = h(m.name);
        return '<div class="mp-item ' + (off ? 'off ' : '') + (q ? 'sel' : '') + '">' +
          '<button class="mp-name" data-act="cartAdd" data-no="' + no + '" data-name="' + nm + '"' + (off ? ' disabled' : '') + '><span>' + nm + '</span><small>' + (off ? h(m.status) : won(m.price) + '원') + '</small></button>' +
          '<div class="mp-stp">' + (q ? '<button class="stp" data-act="cartSub" data-no="' + no + '" data-name="' + nm + '">−</button><b>' + q + '</b>' : '') +
          '<button class="stp plus" data-act="cartAdd" data-no="' + no + '" data-name="' + nm + '"' + (off ? ' disabled' : '') + '>+</button></div></div>';
      }).join('') + '</div></div>';
    }).join('');
    return '<div class="mp">' + (list || '<p class="empty">등록된 메뉴가 없습니다. 구글 시트 「메뉴」 탭을 확인해 주십시오.</p>') + '</div>' +
      '<div class="cart-bar"><input class="note-in" data-input="note" data-no="' + no + '" placeholder="요청사항 (선택, 예: 덜 맵게)" value="' + h(S.notes[no] || '') + '" maxlength="100">' +
      '<div class="cart-row"><div class="cart-sum"><b>' + ci.cnt + '</b>개 · <b>' + won(ci.sum) + '</b>원</div>' +
      (ci.cnt ? '<button class="btn ghost" data-act="cartClear" data-no="' + no + '">비우기</button>' : '') +
      '<button class="btn primary big" data-act="submitOrder" data-no="' + no + '"' + (ci.cnt ? '' : ' disabled') + '>주문 넣기</button></div></div>';
  }

  function orderList(t) {
    if (!t.orders.length) {
      return '<div class="ol"><h4>주문 내역</h4><p class="empty">' + (t.active ? '주문 내역이 없습니다.' : '빈 테이블입니다. 인원을 입력하거나 주문을 넣으면 착석 처리됩니다.') + '</p></div>';
    }
    var pendIds = t.orders.filter(function (o) { return o.status === '대기'; }).map(function (o) { return o.id; });
    var rows = t.orders.slice().sort(function (a, b) { return a.time - b.time; }).map(function (o) {
      var btns = '';
      if (o.status === '대기') btns += '<button class="btn sm ok" data-act="serveOne" data-id="' + h(o.id) + '">서빙완료</button>';
      if (o.status === '서빙완료') btns += '<button class="btn sm ghost" data-act="unserve" data-id="' + h(o.id) + '">되돌리기</button>';
      if (o.status !== '취소') btns += '<button class="btn sm danger-ghost" data-act="cancelOrder" data-id="' + h(o.id) + '" data-name="' + h(o.name) + '" data-qty="' + o.qty + '">취소</button>';
      else btns += '<button class="btn sm ghost" data-act="unserve" data-id="' + h(o.id) + '">복구</button>';
      return '<div class="ol-row s-' + o.status + '"><div class="ol-main"><span class="ol-time">' + hhmm(o.time) + '</span><b class="ol-name">' + h(o.name) + '</b>' +
        '<span>×' + o.qty + '</span><span class="ol-amt">' + won(o.amount) + '</span></div>' +
        '<div class="ol-sub"><span class="st st-' + o.status + '">' + o.status + '</span>' + (o.by ? '<small>' + h(o.by) + '</small>' : '') +
        (o.note ? '<small class="note">' + h(o.note) + '</small>' : '') + '<span class="ol-btns">' + btns + '</span></div></div>';
    }).join('');
    return '<div class="ol"><div class="ol-head"><h4>주문 내역</h4>' +
      (pendIds.length > 1 ? '<button class="btn sm ok" data-act="serveAll" data-ids="' + h(pendIds.join(',')) + '">미서빙 ' + pendIds.length + '건 모두 완료</button>' : '') +
      '</div>' + rows + '</div>';
  }

  function payBox(t) {
    if (!t.active) return '';
    return '<div class="paybox"><h4>결제</h4>' +
      (t.payments.length ? '<div class="pay-hist">' + t.payments.map(function (p) {
        return '<div><span>' + hhmm(p.time) + ' · ' + h(p.method) + (p.by ? ' · ' + h(p.by) : '') + '</span><b>' + won(p.amount) + '원</b></div>';
      }).join('') + '</div>' : '') +
      '<div class="pay-btns"><button class="btn primary big" data-act="pay" data-no="' + t.no + '" data-m="현금">현금 결제' + (t.balance > 0 ? ' ' + won(t.balance) + '원' : '') + '</button>' +
      '<button class="btn ghost" data-act="pay" data-no="' + t.no + '" data-m="계좌이체">계좌이체</button></div>' +
      '<div class="tbl-actions"><button class="btn ghost" data-act="move" data-no="' + t.no + '">테이블 이동</button>' +
      '<button class="btn danger" data-act="clear" data-no="' + t.no + '">테이블 정리(퇴장)</button></div></div>';
  }

  /* 정산 */
  function card(label, val, sub, cls) {
    return '<div class="card ' + (cls || '') + '"><span>' + label + '</span><b>' + val + '</b><small>' + (sub || '') + '</small></div>';
  }
  function viewSettle() {
    var s = S.summary;
    if (!s) return '<div class="loading">정산 자료를 불러오는 중…</div>';
    var maxAmt = Math.max.apply(null, [1].concat(s.menu.map(function (m) { return m.amount; })));
    var menuRows = s.menu.map(function (m) {
      var pct = s.orderTotal ? Math.round(m.amount / s.orderTotal * 100) : 0;
      return '<tr><td>' + h(m.cat) + '</td><td><b>' + h(m.name) + '</b></td><td class="r">' + won(m.price) + '</td><td class="r">' + m.qty + '</td>' +
        '<td class="r"><b>' + won(m.amount) + '</b></td><td><div class="bar"><i style="width:' + Math.round(m.amount / maxAmt * 100) + '%"></i></div> <small class="muted">' + pct + '%</small></td></tr>';
    }).join('');
    var sessRows = s.sessions.map(function (x) {
      return '<tr><td><b>' + x.table + '번</b></td><td>' + hhmm(x.seatedAt) + '</td><td>' + (x.open ? '-' : hhmm(x.closedAt)) + '</td>' +
        '<td class="r">' + x.people + '</td><td class="r">' + won(x.total) + '</td><td class="r">' + won(x.paid) + '</td>' +
        '<td class="r ' + (x.balance > 0 ? 'red' : x.balance < 0 ? 'purple' : '') + '">' + won(x.balance) + '</td>' +
        '<td>' + (x.open ? '이용 중' : '정리') + '</td></tr>';
    }).join('');
    return '<div class="settle"><div class="settle-head"><div><h2>' + h(s.eventName) + ' 정산</h2><span class="muted">' + fmtDT(s.generatedAt) + ' 기준 (15초마다 자동 갱신)</span></div>' +
      '<div class="noprint"><button class="btn ghost" data-act="loadSummary">새로고침</button><button class="btn primary" data-act="print">인쇄</button></div></div>' +
      '<div class="cards">' +
      card('총 주문액 (취소 제외)', won(s.orderTotal) + '원', '판매 수량 ' + s.itemsCount + '개') +
      card('수납액', won(s.paidTotal) + '원', '현금 ' + won(s.byMethod['현금']) + ' · 이체 ' + won(s.byMethod['계좌이체'])) +
      card('미수금', won(s.outstanding) + '원', s.overpaid ? '초과 결제 ' + won(s.overpaid) + '원 별도' : '받을 금액 합계', s.outstanding ? 'danger' : '') +
      card('이용 팀', s.sessionCount + '팀', '현재 이용 중 ' + s.openCount + '팀') +
      card('누적 인원', s.peopleTotal + '명', '착석 시 입력한 인원 기준') +
      card('주문 취소', s.cancelCount + '건', won(s.cancelAmount) + '원') +
      '</div>' + (s.pendingCount ? '<p class="warnbox">미서빙 주문 ' + s.pendingCount + '건이 남아 있습니다.</p>' : '') +
      '<h3>메뉴별 판매 현황</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>분류</th><th>메뉴</th><th class="r">단가</th><th class="r">수량</th><th class="r">금액</th><th>비중</th></tr></thead>' +
      '<tbody>' + (menuRows || '<tr><td colspan="6" class="empty">판매 내역이 없습니다.</td></tr>') + '</tbody>' +
      '<tfoot><tr><td colspan="3">합계</td><td class="r">' + s.itemsCount + '</td><td class="r">' + won(s.orderTotal) + '</td><td></td></tr></tfoot></table></div>' +
      '<h3>테이블(팀)별 내역</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>테이블</th><th>착석</th><th>정리</th><th class="r">인원</th><th class="r">주문액</th><th class="r">결제액</th><th class="r">잔액</th><th>상태</th></tr></thead>' +
      '<tbody>' + (sessRows || '<tr><td colspan="8" class="empty">이용 내역이 없습니다.</td></tr>') + '</tbody></table></div></div>';
  }

  /* ───────── 모달 ───────── */
  function topModal() { return S.modals[S.modals.length - 1]; }
  function openModal(m) { S.modals.push(m); renderModal(); }
  function closeModal() {
    var m = S.modals.pop();
    if (m && m.resolve) m.resolve(false);
    renderModal();
  }
  function closeAllModals() { while (S.modals.length) closeModal(); }
  function renderModal() {
    var root = $('#modal-root'), m = topModal();
    if (!m) { root.innerHTML = ''; document.body.classList.remove('modal-open'); return; }
    if (m.type === 'table' && !getT(m.no)) { S.modals.pop(); return renderModal(); }
    document.body.classList.add('modal-open');
    var sc = saveScroll(root);
    root.innerHTML = '<div class="backdrop" data-act="backdrop"><div class="modal ' + (m.size || '') + '" role="dialog">' + MODALS[m.type](m) + '</div></div>';
    restoreScroll(sc, root);
    if (!m.focused) {
      var af = root.querySelector('[data-autofocus]');
      if (af) { af.focus(); m.focused = true; }
    }
  }
  function ask(o) {
    return new Promise(function (resolve) { openModal(Object.assign({ type: 'confirm', resolve: resolve }, o)); });
  }
  function head(title, sub) {
    return '<div class="m-head"><h3>' + title + '</h3>' + (sub ? '<span class="muted">' + sub + '</span>' : '') + '<button class="x" data-act="close" aria-label="닫기">×</button></div>';
  }

  var MODALS = {
    table: function (m) {
      var t = getT(m.no);
      return head(m.no + '번 테이블', t.active ? '착석 ' + hhmm(t.seatedAt) + ' · ' + mins(t.seatedAt) + '분 경과' : '빈자리') + tableDetail(m.no, 'pos');
    },
    confirm: function (m) {
      return head(h(m.title)) + '<div class="m-body">' + (m.html || '') + '</div>' +
        '<div class="m-foot"><button class="btn ghost" data-act="confirmNo">' + (m.cancel || '취소') + '</button>' +
        '<button class="btn ' + (m.danger ? 'danger' : 'primary') + '" data-act="confirmYes">' + (m.ok || '확인') + '</button></div>';
    },
    pay: function (m) {
      var t = getT(m.no);
      var cash = m.method === '현금';
      return head(m.no + '번 테이블 결제') + '<div class="m-body">' +
        '<div class="pay-due"><span>받을 금액</span><b>' + won(Math.max(0, t.balance)) + '원</b><small>주문 ' + won(t.total) + '원 · 기결제 ' + won(t.paid) + '원</small></div>' +
        '<div class="seg"><button class="' + (cash ? 'on' : '') + '" data-act="payMethod" data-v="현금">현금</button><button class="' + (!cash ? 'on' : '') + '" data-act="payMethod" data-v="계좌이체">계좌이체</button></div>' +
        '<label class="fld"><span>결제 금액</span><input id="payAmt" type="number" inputmode="numeric" data-input="payAmt" value="' + h(m.amount) + '"></label>' +
        (cash ? '<label class="fld"><span>받은 돈</span><input id="payRecv" type="number" inputmode="numeric" data-input="payRecv" placeholder="손님께 받은 현금" value="' + h(m.recv) + '"></label>' +
          '<div class="quick">' + [10000, 50000, 100000].map(function (v) { return '<button class="btn sm ghost" data-act="recvAdd" data-v="' + v + '">+' + won(v) + '</button>'; }).join('') +
          '<button class="btn sm ghost" data-act="recvExact">금액 그대로</button><button class="btn sm ghost" data-act="recvReset">지우기</button></div>' +
          '<div class="change">거스름돈 <b id="changeVal">' + changeText(m) + '</b></div>' : '') +
        '<p class="hint">나눠 내기 등 일부 금액만 받을 경우 결제 금액을 수정하십시오. 잘못 처리한 결제는 음수 금액(예: -10000)으로 정정할 수 있습니다.</p></div>' +
        '<div class="m-foot"><button class="btn ghost" data-act="close">닫기</button><button class="btn primary" data-act="payConfirm">결제 완료 처리</button></div>';
    },
    memo: function (m) {
      var t = getT(m.no);
      return head(m.no + '번 테이블 메모') + '<div class="m-body"><label class="fld"><span>메모 (예: 단체명, 예약자, 특이사항)</span>' +
        '<textarea id="memoIn" maxlength="200" data-autofocus>' + h(t.memo) + '</textarea></label></div>' +
        '<div class="m-foot"><button class="btn ghost" data-act="close">닫기</button><button class="btn primary" data-act="memoSave">저장</button></div>';
    },
    move: function (m) {
      var empties = S.state.tables.filter(function (t) { return !t.active; });
      return head(m.no + '번 테이블 이동') + '<div class="m-body"><p>옮겨 갈 빈 테이블을 선택하십시오. 인원·주문·결제 내역이 함께 이동합니다.</p>' +
        '<div class="move-grid">' + (empties.map(function (t) { return '<button class="btn ghost" data-act="moveTo" data-to="' + t.no + '">' + t.no + '</button>'; }).join('') || '<p class="empty">빈 테이블이 없습니다.</p>') + '</div></div>';
    },
    menuAdmin: function () {
      return head('메뉴 품절관리') + '<div class="m-body"><p class="muted">메뉴 추가·가격 변경은 구글 시트 「메뉴」 탭에서 하십시오.</p>' +
        S.state.menu.map(function (m) {
          var sold = m.status === '품절';
          return '<div class="madmin-row ' + (sold ? 'soldout' : '') + '"><div class="nm"><b>' + h(m.name) + '</b><small>' + h(m.cat) + ' · ' + won(m.price) + '원</small></div>' +
            '<button class="btn sm ' + (sold ? 'ok' : 'danger-ghost') + '" data-act="menuToggle" data-name="' + h(m.name) + '" data-v="' + (sold ? '판매' : '품절') + '">' + (sold ? '판매 재개' : '품절 처리') + '</button></div>';
        }).join('') + '</div>';
    },
    pin: function (m) {
      return '<div class="m-head"><h3>접속 비밀번호</h3></div><div class="m-body">' + (m.error ? '<p class="red">' + h(m.error) + '</p>' : '') +
        '<p>구글 시트 「설정」 탭의 접속비밀번호를 입력하십시오.</p><label class="fld"><input id="pinIn" type="password" inputmode="numeric" data-autofocus autocomplete="off"></label></div>' +
        '<div class="m-foot"><button class="btn primary" data-act="pinSave">확인</button></div>';
    },
    staff: function () {
      return head('입력자 이름') + '<div class="m-body"><p>주문·결제 기록에 함께 저장됩니다. (선택 사항)</p>' +
        '<label class="fld"><input id="staffIn" maxlength="20" placeholder="예: 홍길동" value="' + h(S.staff) + '" data-autofocus></label></div>' +
        '<div class="m-foot"><button class="btn ghost" data-act="close">닫기</button><button class="btn primary" data-act="staffSave">저장</button></div>';
    },
    settings: function () {
      var fixed = !!CFG.API_URL;
      return head('설정') + '<div class="m-body">' +
        (DEMO ? '<p><b>체험판 모드</b>입니다. 데이터는 이 브라우저에만 저장됩니다.</p><div class="set-row"><button class="btn ghost" data-act="demoReset">체험 데이터 초기화</button><button class="btn ghost" data-act="exitDemo">체험판 종료</button></div>'
          : '<label class="fld"><span>서버 주소 (Apps Script 웹 앱 URL)' + (fixed ? ' — config.js에 지정됨' : '') + '</span><input id="apiEdit" value="' + h(API_URL) + '"' + (fixed ? ' disabled' : '') + '></label>' +
            (fixed ? '' : '<div class="set-row"><button class="btn ghost" data-act="apiSave">주소 저장</button></div>')) +
        '<div class="set-row"><button class="btn ghost" data-act="staff">입력자 이름: ' + h(S.staff || '미설정') + '</button>' +
        (!DEMO ? '<button class="btn ghost" data-act="pinReset">접속 비밀번호 다시 입력</button>' : '') + '</div>' +
        '<p class="hint">화면 갱신 간격: ' + (Number(CFG.POLL_MS) / 1000) + '초 (포스 화면은 최대 3초)</p></div>';
    }
  };
  function changeText(m) {
    var a = Number(m.amount) || 0, r = Number(m.recv) || 0;
    if (!r) return '-';
    var c = r - a;
    return c < 0 ? '<span class="red">' + won(-c) + '원 부족</span>' : won(c) + '원';
  }
  function askPin(err) {
    S.needPin = true;
    var m = topModal();
    if (m && m.type === 'pin') { m.error = err; renderModal(); return; }
    openModal({ type: 'pin', error: S.pin ? err : '' });
  }

  /* ───────── 이벤트 처리 ───────── */
  function busyGuard() {
    if (S.inflight) { toast('이전 요청을 처리하고 있습니다. 잠시 후 다시 눌러 주십시오.'); return true; }
    return false;
  }
  function setOrderLocal(ids, status) {
    S.state.tables.forEach(function (t) {
      t.orders.forEach(function (o) { if (ids.indexOf(o.id) >= 0) o.status = status; });
      t.pending = t.orders.filter(function (o) { return o.status === '대기'; }).length;
    });
    render();
  }

  var A = {
    filter: function (el) { S.filter = el.dataset.v; render(); },
    openTable: function (el) { openModal({ type: 'table', no: Number(el.dataset.no), live: true, size: 'xl' }); },
    goTable: function (el) { location.hash = '#serve/' + el.dataset.no; },
    close: function () { closeModal(); },
    backdrop: function (el, e) { if (e.target === el) { var m = topModal(); if (m && m.type !== 'pin') closeModal(); } },
    tab: function (el) { S.tab[el.dataset.ctx] = el.dataset.v; render(); },

    cartAdd: function (el) {
      var no = Number(el.dataset.no), n = el.dataset.name;
      var c = S.carts[no] = S.carts[no] || {};
      c[n] = Math.min(99, (c[n] || 0) + 1);
      delete S.cartReq[no];
      render();
    },
    cartSub: function (el) {
      var no = Number(el.dataset.no), n = el.dataset.name, c = S.carts[no] || {};
      c[n] = (c[n] || 0) - 1;
      if (c[n] <= 0) delete c[n];
      delete S.cartReq[no];
      render();
    },
    cartClear: function (el) {
      var no = Number(el.dataset.no);
      delete S.carts[no]; delete S.cartReq[no]; delete S.notes[no];
      render();
    },
    submitOrder: function (el) {
      var no = Number(el.dataset.no), ci = cartInfo(no);
      if (!ci.cnt || busyGuard()) return;
      var note = S.notes[no] || '';
      ask({
        title: no + '번 테이블 주문 확인',
        html: '<ul class="confirm-list">' + ci.items.map(function (i) { return '<li><span>' + h(i.name) + '</span><b>×' + i.qty + '</b></li>'; }).join('') + '</ul>' +
          '<p class="confirm-total">합계 <b>' + won(ci.sum) + '원</b></p>' + (note ? '<p class="muted">요청사항: ' + h(note) + '</p>' : ''),
        ok: '주문 넣기'
      }).then(function (ok) {
        if (!ok) return;
        if (!S.cartReq[no]) S.cartReq[no] = rid();
        var payload = { table: no, items: ci.items.map(function (i) { return { name: i.name, qty: i.qty }; }), requestId: S.cartReq[no], note: note };
        if (S.peopleDraft[no] != null) payload.people = S.peopleDraft[no];
        return send('order', payload).then(function (r) {
          if (!r) return;
          delete S.carts[no]; delete S.cartReq[no]; delete S.notes[no];
          S.tab.serve = 'list';
          render();
          toast(r.duplicate ? '이미 접수된 주문입니다.' : no + '번 테이블 주문이 접수되었습니다.');
        });
      });
    },
    people: function (el) {
      var no = Number(el.dataset.no), d = Number(el.dataset.d), t = getT(no);
      var v = Math.max(0, Math.min(99, peopleOf(t) + d));
      S.peopleDraft[no] = v;
      render();
      clearTimeout(S.peopleTimer[no]);
      S.peopleTimer[no] = setTimeout(function () {
        var val = S.peopleDraft[no], cur = getT(no);
        if (val == null) return;
        if ((!cur.active && val === 0) || (cur.active && cur.people === val)) { delete S.peopleDraft[no]; render(); return; }
        send('updateTable', { table: no, people: val }).then(function () {
          if (S.peopleDraft[no] === val) delete S.peopleDraft[no];
          render();
        });
      }, 700);
    },
    spoon: function (el) {
      var no = Number(el.dataset.no), t = getT(no), v = !t.spoon;
      t.spoon = v; render();
      send('updateTable', { table: no, spoon: v });
    },
    memo: function (el) { openModal({ type: 'memo', no: Number(el.dataset.no) }); },
    memoSave: function () {
      var m = topModal();
      send('updateTable', { table: m.no, memo: $('#memoIn').value }).then(function (r) { if (r) { closeModal(); toast('메모를 저장했습니다.'); } });
    },
    serveOne: function (el) {
      var id = el.dataset.id;
      setOrderLocal([id], '서빙완료');
      send('setOrderStatus', { ids: [id], status: '서빙완료' });
    },
    serveAll: function (el) {
      var ids = el.dataset.ids.split(',');
      setOrderLocal(ids, '서빙완료');
      send('setOrderStatus', { ids: ids, status: '서빙완료' }, ids.length + '건을 서빙완료 처리했습니다.');
    },
    unserve: function (el) {
      var id = el.dataset.id;
      setOrderLocal([id], '대기');
      send('setOrderStatus', { ids: [id], status: '대기' });
    },
    cancelOrder: function (el) {
      var id = el.dataset.id;
      ask({ title: '주문 취소', html: '<p>「' + h(el.dataset.name) + ' ×' + h(el.dataset.qty) + '」 주문을 취소하시겠습니까?<br><small class="muted">취소한 주문은 금액에서 제외되며, 복구할 수 있습니다.</small></p>', ok: '주문 취소', cancel: '닫기', danger: true })
        .then(function (ok) {
          if (!ok) return;
          setOrderLocal([id], '취소');
          send('setOrderStatus', { ids: [id], status: '취소' }, '주문을 취소했습니다.');
        });
    },

    pay: function (el) {
      var no = Number(el.dataset.no), t = getT(no);
      openModal({ type: 'pay', no: no, method: el.dataset.m, amount: t.balance > 0 ? t.balance : '', recv: '' });
    },
    payMethod: function (el) { var m = topModal(); m.method = el.dataset.v; renderModal(); },
    recvAdd: function (el) { var m = topModal(); m.recv = (Number(m.recv) || 0) + Number(el.dataset.v); renderModal(); },
    recvExact: function () { var m = topModal(); m.recv = m.amount; renderModal(); },
    recvReset: function () { var m = topModal(); m.recv = ''; renderModal(); },
    payConfirm: function () {
      var m = topModal();
      var amount = Math.round(Number(m.amount));
      if (!amount) { toast('결제 금액을 입력해 주십시오.', 'err'); return; }
      var recv = Number(m.recv) || 0;
      if (m.method === '현금' && recv && amount > 0 && recv < amount) { toast('받은 돈이 결제 금액보다 적습니다.', 'err'); return; }
      if (busyGuard()) return;
      var change = m.method === '현금' && recv ? recv - amount : 0;
      send('pay', { table: m.no, amount: amount, method: m.method }).then(function (r) {
        if (!r) return;
        closeModal();
        toast(m.no + '번 테이블 ' + won(amount) + '원 ' + m.method + ' 결제 처리' + (change > 0 ? ' · 거스름돈 ' + won(change) + '원' : ''));
      });
    },
    clear: function (el) {
      var no = Number(el.dataset.no), t = getT(no), warn = [];
      if (t.balance > 0) warn.push('미결제 금액 ' + won(t.balance) + '원');
      if (t.balance < 0) warn.push('초과 결제 ' + won(-t.balance) + '원');
      if (t.pending) warn.push('미서빙 주문 ' + t.pending + '건');
      ask({
        title: no + '번 테이블 정리(퇴장)',
        html: warn.length
          ? '<p class="warnbox">다음 사항이 남아 있습니다.<br>' + warn.join('<br>') + '</p><p>그래도 정리하시겠습니까? 이용 기록은 「이용내역」 시트에 보존됩니다.</p>'
          : '<p>손님 퇴장 처리 후 빈자리로 변경합니다. 이용 기록은 「이용내역」 시트에 보존됩니다.</p>',
        ok: warn.length ? '그래도 정리' : '정리', danger: !!warn.length
      }).then(function (ok) {
        if (!ok || busyGuard()) return;
        send('clearTable', { table: no, force: true }).then(function (r) {
          if (!r) return;
          toast(no + '번 테이블을 정리했습니다.');
          if (route().view === 'serve') location.hash = '#serve';
          else { var tm = topModal(); if (tm && tm.type === 'table') closeModal(); }
        });
      });
    },
    move: function (el) { openModal({ type: 'move', no: Number(el.dataset.no) }); },
    moveTo: function (el) {
      var m = topModal(), to = Number(el.dataset.to);
      if (busyGuard()) return;
      send('moveTable', { table: m.no, to: to }).then(function (r) {
        if (!r) return;
        closeModal();
        toast(m.no + '번 → ' + to + '번 테이블로 이동했습니다.');
        if (route().view === 'serve') location.hash = '#serve/' + to;
        else { var tm = topModal(); if (tm && tm.type === 'table') { tm.no = to; renderModal(); } }
      });
    },
    menuAdmin: function () { openModal({ type: 'menuAdmin', live: true }); },
    menuToggle: function (el) { send('setMenuStatus', { name: el.dataset.name, status: el.dataset.v }, '「' + el.dataset.name + '」 ' + el.dataset.v + ' 처리했습니다.'); },

    confirmYes: function () { var m = S.modals.pop(); renderModal(); m.resolve(true); },
    confirmNo: function () { closeModal(); },

    staff: function () { openModal({ type: 'staff' }); },
    staffSave: function () {
      S.staff = $('#staffIn').value.trim().slice(0, 20);
      LS.set('staff', S.staff);
      closeModal();
      if (topModal() && topModal().type === 'settings') renderModal();
      renderTopbar();
    },
    settings: function () { openModal({ type: 'settings' }); },
    apiSave: function () {
      var v = $('#apiEdit').value.trim();
      if (v && !/^https:\/\/script\.google\.com\//.test(v)) { toast('Apps Script 웹 앱 주소(https://script.google.com/...)를 입력해 주십시오.', 'err'); return; }
      API_URL = v; LS.set('api', v);
      S.state = null; S.rev = -1;
      closeAllModals(); render(); poll();
    },
    pinReset: function () { LS.del('pin'); S.pin = ''; closeAllModals(); askPin(''); },
    pinSave: function () {
      S.pin = $('#pinIn').value.trim();
      LS.set('pin', S.pin);
      S.needPin = false;
      S.modals = S.modals.filter(function (m) { return m.type !== 'pin'; });
      renderModal();
      poll();
      if (route().view === 'settle') loadSummary();
    },
    setupSave: function () {
      var v = $('#apiIn').value.trim();
      if (!/^https:\/\/script\.google\.com\//.test(v)) { toast('Apps Script 웹 앱 주소(https://script.google.com/...)를 입력해 주십시오.', 'err'); return; }
      API_URL = v; LS.set('api', v);
      render(); poll();
    },
    goDemo: function () { location.href = location.pathname + '?demo=1' + location.hash; },
    exitDemo: function () { location.href = location.pathname; },
    demoReset: function () {
      ask({ title: '체험 데이터 초기화', html: '<p>체험판의 주문·결제 기록을 모두 지웁니다.</p>', ok: '초기화', danger: true }).then(function (ok) {
        if (!ok) return;
        window.DemoBackend && window.DemoBackend.reset();
        location.reload();
      });
    },
    loadSummary: function () { loadSummary(); toast('정산 자료를 새로 불러왔습니다.'); },
    print: function () { window.print(); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = A[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target, k = el.dataset && el.dataset.input;
    if (!k) return;
    if (k === 'note') S.notes[Number(el.dataset.no)] = el.value;
    if (k === 'payAmt' || k === 'payRecv') {
      var m = topModal();
      if (k === 'payAmt') m.amount = el.value; else m.recv = el.value;
      var cv = $('#changeVal');
      if (cv) cv.innerHTML = changeText(m);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && topModal() && topModal().type !== 'pin') closeModal();
    if (e.key === 'Enter' && e.target.id === 'pinIn') A.pinSave();
  });

  window.addEventListener('hashchange', function () {
    S.modals.forEach(function (m) { if (m.resolve) m.resolve(false); });
    S.modals = [];
    renderModal();
    window.scrollTo(0, 0);
    render();
    if (route().view === 'settle') loadSummary();
    schedule();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  setInterval(updateSync, 1000);
  setInterval(function () { if (S.state && !S.inflight && !topModalStatic()) render(); }, 30000);
  setInterval(function () { if (route().view === 'settle' && !document.hidden && ready()) loadSummary(); }, 15000);
  function topModalStatic() { var m = topModal(); return m && !m.live; }

  // 다른 탭에서 체험판 데이터가 바뀌면 즉시 반영
  if (DEMO) window.addEventListener('storage', function (e) { if (e.key === 'hujeom-demo-db-v1') poll(); });

  /* ───────── 시작 ───────── */
  render();
  if (ready()) {
    poll();
    if (route().view === 'settle') loadSummary();
  }
})();
</script>
</body>
</html>
